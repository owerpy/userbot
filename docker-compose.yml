services:
  board-userbot:
    # Готовый образ собирается в GitHub Actions — на сервере только pull.
    # Собрать локально при отладке: docker compose build (см. закомментированное build)
    image: ghcr.io/owerpy/board-userbot:latest
    # build: .
    pull_policy: always
    container_name: board_userbot
    restart: unless-stopped
    env_file: .env
    volumes:
      - board_session:/data        # сессия Telegram — не удаляй том, иначе вход заново
    networks: [truck_net]          # та же сеть, что у бэкенда и Postgres

volumes:
  board_session:

networks:
  truck_net:
    external: true
    name: truck-delivery_truck_net
